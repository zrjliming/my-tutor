<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="0.55" stop-color="#6D4AE8"/>
      <stop offset="1" stop-color="#4527A0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E1065" flood-opacity="0.35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS 图标网格：824×824 圆角方块，居中 -->
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <!-- 主对话气泡 -->
  <g transform="translate(0,45)">
  <g filter="url(#shadow)">
    <path d="M 250 330
             Q 250 270 310 270
             L 680 270
             Q 740 270 740 330
             L 740 590
             Q 740 650 680 650
             L 430 650
             L 330 740
             L 350 650
             L 310 650
             Q 250 650 250 590 Z" fill="#FFFFFF"/>
  </g>

  <!-- Aa -->
  <text x="292" y="535" font-family="SF Pro Rounded, Avenir Next, Helvetica Neue, Arial" font-weight="800" font-size="190" letter-spacing="-4" fill="url(#ink)">Aa</text>

  <!-- 声波 -->
  <g fill="url(#ink)">
    <rect x="586" y="425" width="24" height="70" rx="12"/>
    <rect x="626" y="390" width="24" height="140" rx="12"/>
    <rect x="666" y="415" width="24" height="90" rx="12" opacity="0.85"/>
  </g>

  </g>

  <!-- 纠错徽章 -->
  <g filter="url(#shadow)">
    <circle cx="742" cy="312" r="112" fill="url(#badge)"/>
  </g>
  <circle cx="742" cy="312" r="112" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M 690 314 L 727 351 L 798 274" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
